[project]
name = "pixelembed"
version = "0.1.0"
description = "Pathology foundation-model embeddings and classification probes for ABeta, tau, BACH, and TIL tiles"
requires-python = ">=3.14"
dependencies = [
    "pillow>=10.0.0",
    "pixeltable>=0.6.3",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "shapely>=2.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
embeddings = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "timm>=1.0.0",
]
cnn = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]
pathology = [
    "timm>=1.0.0",
    "conch @ git+https://github.com/MahmoodLab/CONCH.git",
]
notebooks = [
    "geopandas>=1.1.4",
    "ipywidgets>=8.1.8",
    "matplotlib>=3.11.0",
    "shapely>=2.1.2",
]
